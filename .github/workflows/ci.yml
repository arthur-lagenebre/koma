name: conformance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.14 carries the Unicode 16.0.0 data section 3 names; an older Python
      # folds names with older data and makes the validator warn.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Layer 2. Compiles the four schemas, validates the reference
      # instances, and asserts that every deliberately broken document is
      # rejected. The expected counts are asserted inside the test files, not
      # in these comments, so that a shrinking suite cannot pass green.
      - name: Schemas
        run: python tests/test_schemas.py

      # Section 10. The expectations are hand-written from the specification,
      # so this step fails whenever the algorithm and the prose drift apart.
      - name: Pairing algorithm
        run: python tests/test_spread.py

      # Section 15.1. Both the committed packages and a freshly rebuilt
      # corpus must behave exactly as expected.json declares.
      - name: Conformance corpus
        run: python tests/test_corpus.py

      - name: CBZ converter
        run: python tests/test_converter.py

      # Section 14.1. The corpus is what an implementer reads to learn what
      # canonical means, so the corpus is what is held to it.
      - name: Canonical serialization
        run: python tests/test_canonical.py

      # The counters quoted in README.md must match the artifacts.
      - name: Documentation counters
        run: python tests/test_docs.py

      # SHA256SUMS must hash exactly the tracked files, as they are now. It
      # drifted unnoticed for most of the repository's history before this.
      - name: Checksums
        run: |
          sha256sum --strict --quiet -c SHA256SUMS
          diff <(git ls-files ':!SHA256SUMS') <(cut -c 67- SHA256SUMS)

      # The repository must never carry third-party comics. Test material is
      # synthetic and generated by the corpus builder.
      - name: No large binaries
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +2M -print)
          if [ -n "$big" ]; then
            echo "Files over 2 MB are not allowed in this repository:"
            echo "$big"
            exit 1
          fi

  # A workflow that does not parse fails before it starts, and says so only
  # in the Actions tab. actionlint reads the workflows the way GitHub will,
  # contexts included, and fails the push instead.
  workflows:
    # Pinned rather than latest: actionlint runs shellcheck from the image,
    # and a linter has nothing to gain from an image moving under it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.9/scripts/download-actionlint.bash) 1.7.9
          ./actionlint -color
